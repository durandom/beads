[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speckit-to-beads"
version = "0.1.0"
description = "Convert spec-kit tasks.md and spec.md to beads issues"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Beads Contributors" }
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
speckit-to-beads = "speckit_to_beads.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/speckit_to_beads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
